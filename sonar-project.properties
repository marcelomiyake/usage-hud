sonar.projectKey=marcelomiyake_usage-hud
sonar.organization=marcelomiyake
sonar.projectName=usage-hud
sonar.host.url=https://sonarcloud.io

sonar.sources=src,scripts
sonar.tests=tests
sonar.exclusions=**/node_modules/**,coverage/**,types/**
sonar.coverage.exclusions=src/**/*.d.ts,scripts/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.test.json
sonar.sourceEncoding=UTF-8
# Fail the scan when the built-in gate fails; scripts/check-sonar-gate.mjs then holds all code to zero issues.
sonar.qualitygate.wait=true
